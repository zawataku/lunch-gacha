# docker compose -f docker-compose.dev.yml up --build

services:
  dev-server:
    image: node:lts-alpine
    working_dir: /app
    ports:
      - "5173:5173"
      - "8080:8080"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    command: sh -c "npm install && npm run dev & npm run dev:server"
